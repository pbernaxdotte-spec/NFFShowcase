function figure(face,x){const y=380,w=150,h=300,a=face==='front'?'right':'left',b=face==='front'?'left':'right';skin(x,y,600,h);skin(x+w,y+h,300,h);piece(images.pants,torso[face],x+w,y,300,h);piece(images.shirt,torso[face],x+w,y,300,h);piece(images.shirt,limbs[a][face],x,y,w,h);piece(images.shirt,limbs[b][face],x+450,y,w,h);piece(images.pants,limbs[a][face],x+w,y+h,w,h);piece(images.pants,limbs[b][face],x+300,y+h,w,h)}
function side(face,x){skin(x,380,150,600);piece(images.shirt,limbs[face][face],x,380,150,300);piece(images.pants,limbs[face][face],x,680,150,300)}
function draw(){if(!ready)return;ctx.clearRect(0,0,2048,1243);ctx.imageSmoothingEnabled=false;ctx.drawImage(background,0,0);if(images.shirt||images.pants){side('right',110);figure('front',314);figure('back',1134);side('left',1789)}$('download').disabled=!(images.shirt||images.pants)}
for(const name of ['shirt','pants']){
 $('upload'+name[0].toUpperCase()+name.slice(1)).addEventListener('click',()=>$(name).click());
 $(name).addEventListener('change',async()=>{const file=$(name).files[0],token=++versions[name];if(!file)return;$('error').textContent='';if(file.size>30*1024*1024){$('error').textContent='Choose a PNG smaller than 30 MB.';return}const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();if(token!==versions[name])return;const s=img.naturalWidth/585;if(s<1||!Number.isInteger(s)||img.naturalHeight!==559*s)throw Error('Use a 585 × 559 clothing template, or an exact multiple.');images[name]=img;draw()}catch(e){$('error').textContent=e.message.startsWith('Use a')?e.message:'Could not open this PNG.'}finally{URL.revokeObjectURL(url)}})
}
$('skin').addEventListener('input',draw);
$('download').addEventListener('click',()=>{canvas.toBlob(blob=>{if(!blob){$('error').textContent='Could not export the PNG.';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='NFF-showcase.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)},'image/png')});
</script></body></html>
